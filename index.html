<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simu Marché</title>
  <!-- Bibliothèque de graphiques de TradingView (open source), chargée depuis internet -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.2rem; font-weight: 500; color: #9aa0a6; margin: 0 0 8px; }
    #prix { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .hausse { color: #4caf50; }
    .baisse { color: #f44336; }
    #heure { margin-top: 4px; font-size: 0.85rem; color: #9aa0a6; }
    #statut { margin-top: 12px; font-size: 0.9rem; color: #9aa0a6; }
    #graphique { width: 100%; max-width: 1000px; height: 420px; margin-top: 24px; }

    /* Portefeuille */
    #portefeuille { width: 100%; max-width: 1000px; margin-bottom: 32px; }
    .tuiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .tuile { background: #171a21; border: 1px solid #23262e; border-radius: 10px; padding: 12px 14px; }
    .tuile .label { font-size: 0.8rem; color: #9aa0a6; }
    .tuile .valeur { font-size: 1.3rem; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .ordre { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    .ordre input { background: #171a21; border: 1px solid #23262e; color: #e6e6e6; border-radius: 8px; padding: 10px; width: 140px; font-size: 1rem; }
    .ordre button { border: none; border-radius: 8px; padding: 10px 16px; font-size: 1rem; font-weight: 600; cursor: pointer; color: #fff; }
    #btnAcheter { background: #4caf50; }
    #btnVendre { background: #f44336; }
    #btnToutVendre { background: #23262e; }
    #message { font-size: 0.9rem; color: #9aa0a6; }
    #historique { margin-top: 12px; max-height: 160px; overflow-y: auto; font-size: 0.85rem; }
    #historique table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    #historique th, #historique td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #1c1f26; }
    #historique th { color: #9aa0a6; font-weight: 500; position: sticky; top: 0; background: #0f1115; }
    #historique th:first-child, #historique td:first-child,
    #historique th:nth-child(2), #historique td:nth-child(2) { text-align: left; }
    @media (max-width: 640px) { .tuiles { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <section id="portefeuille">
    <div class="tuiles">
      <div class="tuile"><div class="label">Euros disponibles</div><div class="valeur" id="tuileEuros">—</div></div>
      <div class="tuile"><div class="label">BTC détenus</div><div class="valeur" id="tuileBtc">—</div></div>
      <div class="tuile"><div class="label">Valeur totale</div><div class="valeur" id="tuileTotal">—</div></div>
      <div class="tuile"><div class="label">Gain / perte</div><div class="valeur" id="tuileGain">—</div></div>
    </div>
    <div class="ordre">
      <input id="montant" type="number" min="1" step="1" placeholder="Montant en €">
      <button id="btnAcheter">Acheter</button>
      <button id="btnVendre">Vendre</button>
      <button id="btnToutVendre">Tout vendre</button>
      <span id="message"></span>
    </div>
    <div id="historique">
      <table>
        <thead><tr><th>Heure</th><th>Ordre</th><th>Montant</th><th>Prix BTC</th><th>Quantité BTC</th><th>Gain réalisé</th></tr></thead>
        <tbody id="lignesOrdres"></tbody>
      </table>
    </div>
  </section>

  <h1>BTC / EUR</h1>
  <div id="prix">—</div>
  <div id="heure"></div>
  <div id="statut">Connexion…</div>
  <div id="graphique"></div>

  <script>
    // ================= PARTIE A : LE PRIX EN DIRECT (ton code) =================

    // 1. Liste des serveurs Binance à essayer, dans l'ordre (tous en port 443)
    const serveurs = [
      "wss://data-stream.binance.vision/ws/btceur@trade",
      "wss://stream.binance.com:443/ws/btceur@trade"
    ];

    const affichagePrix = document.getElementById("prix");
    const affichageHeure = document.getElementById("heure");
    const affichageStatut = document.getElementById("statut");
    let ancienPrix = null;

    function connecter(numero) {
      if (numero >= serveurs.length) {
        affichageStatut.textContent = "Erreur de connexion (tous les serveurs ont échoué)";
        return;
      }

      affichageStatut.textContent = "Connexion au serveur " + (numero + 1) + "…";
      const socket = new WebSocket(serveurs[numero]);
      let aRecuUnPrix = false;

      socket.onopen = () => {
        affichageStatut.textContent = "En direct (serveur " + (numero + 1) + ")";
      };

      // 2. À chaque transaction sur Binance, un message arrive ici
      socket.onmessage = (evenement) => {
        aRecuUnPrix = true;
        const donnees = JSON.parse(evenement.data);
        const prix = parseFloat(donnees.p); // "p" = prix de la transaction

        // 3. Couleur : vert si le prix monte, rouge s'il baisse
        if (ancienPrix !== null && prix > ancienPrix) affichagePrix.className = "hausse";
        if (ancienPrix !== null && prix < ancienPrix) affichagePrix.className = "baisse";
        ancienPrix = prix;
        mettreAJourPortefeuille(); // le portefeuille suit le prix en direct

        // 4. Afficher le prix au format français (ex : 54 321,00 €)
        affichagePrix.textContent = prix.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
        affichageHeure.textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR");
      };

      // 5. Si ce serveur échoue avant d'avoir donné un prix, on essaie le suivant
      socket.onclose = () => {
        if (!aRecuUnPrix) {
          connecter(numero + 1);
        } else {
          affichageStatut.textContent = "Déconnecté — recharge la page";
        }
      };
    }

    connecter(0);


    // ================= PARTIE B : LES BOUGIES =================

    // 6. Créer le graphique et une série de bougies
    const graphique = LightweightCharts.createChart(document.getElementById("graphique"), {
      autoSize: true, // le graphique prend la taille de sa boîte
      layout: { background: { color: "#0f1115" }, textColor: "#9aa0a6" },
      grid: { vertLines: { color: "#1c1f26" }, horzLines: { color: "#1c1f26" } },
      timeScale: { timeVisible: true, secondsVisible: false }
    });

    const bougies = graphique.addCandlestickSeries({
      upColor: "#4caf50", wickUpColor: "#4caf50", borderUpColor: "#4caf50",
      downColor: "#f44336", wickDownColor: "#f44336", borderDownColor: "#f44336"
    });

    // Le graphique affiche les heures en UTC. On décale chaque bougie
    // du fuseau de l'ordinateur pour afficher l'heure française.
    const decalage = -new Date().getTimezoneOffset() * 60; // en secondes

    // Une bougie = 4 prix sur 1 minute : ouverture, plus haut, plus bas, clôture
    function versBougie(debutEnMs, ouverture, haut, bas, cloture) {
      return {
        time: Math.floor(debutEnMs / 1000) + decalage,
        open: parseFloat(ouverture),
        high: parseFloat(haut),
        low: parseFloat(bas),
        close: parseFloat(cloture)
      };
    }

    // 7. L'historique : on demande UNE fois les 200 dernières bougies d'1 minute
    const adressesHistorique = [
      "https://data-api.binance.vision/api/v3/klines?symbol=BTCEUR&interval=1m&limit=200",
      "https://api.binance.com/api/v3/klines?symbol=BTCEUR&interval=1m&limit=200"
    ];

    async function chargerHistorique() {
      for (const adresse of adressesHistorique) {
        try {
          const reponse = await fetch(adresse);
          const lignes = await reponse.json();
          // Chaque ligne : [début, ouverture, haut, bas, clôture, volume, ...]
          bougies.setData(lignes.map(l => versBougie(l[0], l[1], l[2], l[3], l[4])));
          return; // ça a marché, on s'arrête
        } catch (erreur) {
          // ce serveur a échoué : la boucle passe au suivant
        }
      }
      affichageStatut.textContent = "Historique des bougies indisponible";
    }

    // 8. Le direct : une 2e connexion qui envoie la bougie en cours chaque seconde
    const serveursBougies = [
      "wss://data-stream.binance.vision/ws/btceur@kline_1m",
      "wss://stream.binance.com:443/ws/btceur@kline_1m"
    ];

    function connecterBougies(numero) {
      if (numero >= serveursBougies.length) return;

      const socket = new WebSocket(serveursBougies[numero]);
      let aRecuUneBougie = false;

      socket.onmessage = (evenement) => {
        aRecuUneBougie = true;
        const k = JSON.parse(evenement.data).k; // "k" = la bougie en cours
        // update() modifie la dernière bougie si c'est la même minute,
        // ou en ajoute une nouvelle si une nouvelle minute commence
        bougies.update(versBougie(k.t, k.o, k.h, k.l, k.c));
      };

      socket.onclose = () => {
        if (!aRecuUneBougie) connecterBougies(numero + 1);
      };
    }

    chargerHistorique().then(() => connecterBougies(0));


    // ================= PARTIE C : LE PORTEFEUILLE VIRTUEL =================

    const CAPITAL_DEPART = 10000; // argent fictif au départ, en €
    let euros = CAPITAL_DEPART;   // euros non investis
    let btc = 0;                  // quantité de BTC détenue
    let coutDesBtc = 0;           // combien on a payé, au total, les BTC encore détenus

    // ╔══════════════════════════════════════════════════════════╗
    // ║                    À TOI DE CODER                        ║
    // ╚══════════════════════════════════════════════════════════╝

    // 9. Valeur totale du portefeuille, en €.
    //    Tu as : euros (€ non investis), btc (quantité de BTC), prix (prix actuel d'1 BTC en €)
    function calculerValeurTotale(euros, btc, prix) {
      return euros + btc * prix;
    }

    // 10. Gain (nombre positif) ou perte (nombre négatif) depuis le départ, en €.
    //     Indice : tu as commencé avec CAPITAL_DEPART euros.
    function calculerGain(valeurTotale) {
      return valeurTotale - CAPITAL_DEPART;
    }

    // 11. Le même gain, en pourcentage du capital de départ.
    //     Exemple : +500 € sur 10 000 € doit donner 5.
    function calculerGainPourcent(gain) {
      return gain / CAPITAL_DEPART * 100;
    }

    // ═══════════════════ FIN DE TA PARTIE ═══════════════════════


    // 12. Afficher le portefeuille (appelé à chaque nouveau prix et après chaque ordre)
    const formatEuros = (n) => n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });

    function mettreAJourPortefeuille() {
      document.getElementById("tuileEuros").textContent = formatEuros(euros);
      document.getElementById("tuileBtc").textContent = btc.toFixed(6) + " ₿";
      if (ancienPrix === null) return; // pas encore de prix : on ne peut rien calculer

      const total = calculerValeurTotale(euros, btc, ancienPrix);
      const gain = calculerGain(total);
      const pourcent = calculerGainPourcent(gain);

      document.getElementById("tuileTotal").textContent = formatEuros(total);
      const tuileGain = document.getElementById("tuileGain");
      const signe = gain > 0 ? "+" : "";
      tuileGain.textContent = signe + formatEuros(gain) + " (" + signe + pourcent.toFixed(2) + " %)";
      tuileGain.className = "valeur " + (gain > 0 ? "hausse" : gain < 0 ? "baisse" : "");
    }

    // 13. Passer un ordre d'achat ou de vente au prix actuel
    const message = document.getElementById("message");

    function ajouterLigneHistorique(type, montant, prix, quantite, gainRealise) {
      const ligne = document.createElement("tr");
      const gainTexte = gainRealise === null ? "—" : (gainRealise > 0 ? "+" : "") + formatEuros(gainRealise);
      ligne.innerHTML =
        "<td>" + new Date().toLocaleTimeString("fr-FR") + "</td>" +
        "<td class='" + (type === "Achat" ? "hausse" : "baisse") + "'>" + type + "</td>" +
        "<td>" + formatEuros(montant) + "</td>" +
        "<td>" + formatEuros(prix) + "</td>" +
        "<td>" + quantite.toFixed(6) + "</td>" +
        "<td>" + gainTexte + "</td>";
      document.getElementById("lignesOrdres").prepend(ligne); // le plus récent en haut
    }

    function acheter() {
      const montant = parseFloat(document.getElementById("montant").value);
      if (ancienPrix === null) { message.textContent = "Attends le premier prix."; return; }
      if (!(montant > 0)) { message.textContent = "Entre un montant positif."; return; }
      if (montant > euros) { message.textContent = "Pas assez d'euros disponibles."; return; }

      const quantite = montant / ancienPrix;
      euros -= montant;
      btc += quantite;
      coutDesBtc += montant;

      ajouterLigneHistorique("Achat", montant, ancienPrix, quantite, null);
      message.textContent = "Achat exécuté.";
      mettreAJourPortefeuille();
    }

    function vendre(montant) {
      if (ancienPrix === null) { message.textContent = "Attends le premier prix."; return; }
      if (!(montant > 0)) { message.textContent = "Entre un montant positif."; return; }

      let quantite = montant / ancienPrix;
      if (quantite > btc + 1e-12) { message.textContent = "Tu n'as pas assez de BTC."; return; }
      quantite = Math.min(quantite, btc);

      // Part des BTC vendus → part du coût d'achat correspondant
      const coutVendu = btc > 0 ? coutDesBtc * (quantite / btc) : 0;
      const gainRealise = montant - coutVendu;

      euros += montant;
      btc -= quantite;
      coutDesBtc -= coutVendu;
      if (btc < 1e-12) { btc = 0; coutDesBtc = 0; } // évite les miettes d'arrondi

      ajouterLigneHistorique("Vente", montant, ancienPrix, quantite, gainRealise);
      message.textContent = "Vente exécutée.";
      mettreAJourPortefeuille();
    }

    document.getElementById("btnAcheter").onclick = acheter;
    document.getElementById("btnVendre").onclick = () =>
      vendre(parseFloat(document.getElementById("montant").value));
    document.getElementById("btnToutVendre").onclick = () => {
      if (ancienPrix !== null) vendre(btc * ancienPrix);
    };

    mettreAJourPortefeuille();
  </script>
</body>
</html>
